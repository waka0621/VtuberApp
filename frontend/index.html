<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>webアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="theme-selector" role="group" aria-label="デザイン選択">
    <span>デザイン：</span>
    <button type="button" data-theme="simple" aria-pressed="false">シンプル</button>
    <button type="button" data-theme="pop" aria-pressed="true">ポップ</button>
    <button type="button" data-theme="cool" aria-pressed="false">クール</button>
    <button type="button" data-theme="cute" aria-pressed="false">キュート</button>
  </div>

  <div id="registerArea" class="user-area" style="width: 100%; background:#f6f6f6; padding:8px;">
    <h3>ユーザー情報</h3>
    <input id="userNickname" type="text" placeholder="nickname (必須)" />
    <input id="userPassword" type="password" placeholder="password (必須)" />
    <div style="margin-top:8px;">
      <button id="addUserButton" type="button">ユーザー登録</button>
    </div>
    <pre id="userJson" style="white-space: pre-wrap; background:#f6f6f6; padding:8px; margin-top:12px;">ユーザー登録の結果を表示</pre>
  </div>

  <section id="loginArea" class="account-area">
    <h3>ログイン</h3>
    <form id="loginForm">
      <input id="loginNickname" type="text" placeholder="ニックネーム" required>
      <input id="loginPassword" type="password" placeholder="password" required>
      <button type="submit">ログイン</button>
    </form>
    <p id="loginMessage" role="status" aria-live="polite"></p>
  </section>

  <section id="myAccount" class="account-area" hidden>
    <h3>マイページ</h3>
    <p id="myProfile"></p>
    <h4>あなたの推し</h4>
    <ul id="myFavorites"></ul>
    <button id="logoutButton" type="button">ログアウト</button>
  </section>

  <div>
    <button id="showJson">JSON 表示</button>
  </div>
  <pre id="tableJson" style="white-space: pre-wrap; background:#f6f6f6; padding:8px;">読み込み待ち...</pre>

  <form id="vtuberForm">
    <input id="vtuberName" type="text" placeholder="name (必須)" required>
    
    <select id="vtuberGender" required>
      <option value="" disabled selected>性別を選択 (必須)</option>
      <option value="女">女</option>
      <option value="男">男</option>
      <option value="その他">その他</option>
      <option value="定義不能">定義不能</option>
    </select>

    <input id="vtuberGroupName" type="text" placeholder="group_name (任意)">
    <input id="vtuberBirthday" type="date" placeholder="birthday (任意)">
    <input id="vtuberColorCode" type="text" placeholder="color_code (任意) 例:#FF0000">
    <textarea id="vtuberNotes" placeholder="notes (任意)"></textarea>

    <button type="submit">追加</button>
  </form>

  <div class="delete-vtuber-area">
    <input id="deleteVtuberId" type="number" placeholder="削除する vtuber_id を入力" />
    <button id="deleteVtuberButton" type="button">削除</button>
  </div>

  <div class="link-area" style="margin-top:24px; border-top:1px solid #ddd; padding-top:16px;">
    <h3>SNSリンク</h3>
    <input id="linkVtuberId" type="number" placeholder="vtuber_id (必須)" />
    <input id="linkSiteName" type="text" placeholder="site_name (例: Twitter, YouTube)" />
    <input id="linkUrl" type="url" placeholder="url (任意)" />
    <textarea id="linkNotes" placeholder="notes (任意)"></textarea>
    <div style="margin-top:8px;">
      <button id="addLinkButton" type="button">リンク登録</button>
      <button id="showLinks" type="button">リンク一覧表示</button>
    </div>
    <pre id="linksJson" style="white-space: pre-wrap; background:#f6f6f6; padding:8px; margin-top:12px;">リンク一覧を表示</pre>
  </div>

  <div class="delete-link-area">
    <input id="deleteLinkId" type="number" placeholder="削除する link_id を入力" />
    <button id="deleteLinkButton" type="button">削除</button>
  </div>

  <div class="user_favorites" style="margin-top:24px; border-top:1px solid #ddd; padding-top:16px;">
    <h3>推し登録</h3>
    <p>ユーザー登録後に推しを登録できます。</p>
    <input id="favoriteVtuberId" type="number" placeholder="favorite vtuber_id を入力" min="1" />
    <button id="addFavoriteButton" type="button">登録</button>
    <p id="favoriteMessage" role="status" aria-live="polite"></p>
  </div>


  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
